name: Deploy

# Every push to main: build the image -> push to GHCR -> deploy on the server.
# The server side lives in deploy/: this workflow only copies it and calls deploy.sh.
on:
  push:
    branches: [main]

# One deploy at a time: a newer push waits until the running deploy finishes
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_URL: https://app.funkicrm.ru

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v7

      - name: Image name
        id: image
        # Image names must be lowercase; the tag is the commit SHA
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.ref }}
          build-args: APP_VERSION=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The server pulls the image with this job's short-lived token
      packages: read
    env:
      DEPLOY_PATH: /srv/lockcrm
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned server host keys: connect only to our server
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Copy deploy scripts to the server
        run: |
          tar -czf - deploy | ssh server "set -e; cd $DEPLOY_PATH; rm -rf deploy.new; mkdir deploy.new; tar -xzf - -C deploy.new --strip-components=1; rm -rf deploy; mv deploy.new deploy"

      - name: Deploy
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s %s\n' "$REGISTRY_USER" "$REGISTRY_TOKEN" | ssh server "bash $DEPLOY_PATH/deploy/deploy.sh $IMAGE $APP_URL"
