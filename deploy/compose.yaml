# Production stack on the server, docker compose project "prod".
# Used only through the scripts in deploy/ (deploy.sh, rollback.sh, restore.sh, seed.sh): they set APP_IMAGE
# and read secrets from /srv/lockcrm/.env (mode 600).

# Container logs are capped: at most 3 files of 10 MB per container
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18
    restart: unless-stopped
    # Errors in the log without DETAIL: for a rejected row Postgres puts the whole row there, with the contact's data
    command: ["postgres", "-c", "log_error_verbosity=terse"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    # No published ports: only containers of this project can reach the database
    volumes:
      # Postgres 18+ keeps data under /var/lib/postgresql/<major>/docker
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  # One-off container from the app image: applies migrations and exits.
  # Not started by `up`; deploy.sh runs it with `run --rm migrate` before the new app starts.
  migrate:
    image: ${APP_IMAGE:?APP_IMAGE is set by deploy/deploy.sh}
    profiles: ["tools"]
    command: ["node", "scripts/migrate.mjs"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      # Optional: only the migration that gives existing contacts an owner (0004) and the demo data read it.
      # Whether it is needed is decided by the migration itself: on a database with data and without this value
      # it fails and changes nothing
      OWNER_EMAIL: ${OWNER_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  app:
    image: ${APP_IMAGE:?APP_IMAGE is set by deploy/deploy.sh}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      # Login: without these the app cannot let anybody in or send the link
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL in .env}
      SMTP_URL: ${SMTP_URL:?set SMTP_URL in .env}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM in .env}
    ports:
      # Localhost only: the outside world reaches the app through nginx (HTTPS)
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logging

volumes:
  db-data:
